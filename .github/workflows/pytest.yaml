name: Run tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and cache test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pytest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: unit
            pytest_args: ""
            docker_env: ""
          - name: cli
            pytest_args: --override-ini="addopts=" -m "cli and not bito"
            docker_env: ""
          - name: native
            pytest_args: -m native
            docker_env: -e TREEFLOW_REQUIRE_NATIVE=1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: test
          load: true
          tags: treeflow-test:ci
          cache-from: type=gha
      - name: Run pytest (${{ matrix.name }})
        run: docker run --rm --workdir /app ${{ matrix.docker_env }} treeflow-test:ci pytest ${{ matrix.pytest_args }}

  notebooks:
    # Smoke-test that the example notebooks and the benchmark notebook run end to
    # end, using the smallest possible workload (env-injected VI step counts and
    # the benchmark's "ci" profile) so this stays fast and only catches breakage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Install treeflow (with test + benchmark extras)
        run: |
          python -m pip install --upgrade pip setuptools --ignore-installed
          python -m pip install -e ".[test,benchmark]"

      - name: Build native op
        run: bash treeflow/acceleration/native/build.sh

      - name: Smoke-run example notebooks
        run: |
          python examples/run_example.py all \
            --num-steps 30 --n-runs 1 --n-samples 20 --timeout 1800

      - name: Smoke-run benchmark notebook
        run: |
          python experiments/run_benchmark.py --profile ci --timeout 1800

  test:
    if: always()
    needs: [pytest, notebooks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.pytest.result }}" == "success" \
             && "${{ needs.notebooks.result }}" == "success" ]]; then
            exit 0
          else
            exit 1
          fi
